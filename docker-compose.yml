version: '3.8'

services:
  churnguard-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churnguard-ai
    ports:
      - "8501:8501"
    restart: unless-stopped
    environment:
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ./data:/app/data
      - ./models:/app/models
