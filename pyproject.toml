[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "churnguard-ai"
version = "1.0.0"
description = "ChurnGuard AI: Enterprise Customer Churn Prediction & Retention Optimization Platform"
authors = [{ name = "Aizaz Ahmad", email = "aizazexforwardian@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["churn-prediction", "machine-learning", "streamlit", "customer-retention", "scikit-learn"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "plotly>=5.18.0",
    "streamlit>=1.28.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
